<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111922">
  <meta name="description" content="龙门令 · 嘉峪关双身份实景寻踪交互原型">
  <title>龙门令 · 嘉峪关实景寻踪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desktop-backdrop" aria-hidden="true"></div>
  <main class="phone" id="app">
    <div class="system-bar">
      <span id="clock">09:41</span>
      <span class="system-icons"><span>◔</span><span>▮▮</span><span class="battery"><i></i></span></span>
    </div>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>令</span></div>
        <div><small id="brandLocation">嘉峪关文物景区</small><strong id="brandTitle">龙门令</strong></div>
      </div>
      <div class="header-actions">
        <button class="language-toggle" id="languageToggle" data-action="toggle-language" aria-label="Switch language">EN</button>
        <button class="role-badge" id="roleBadge" data-action="open-identity" aria-label="选择游戏身份">
          <span class="badge-dot"></span><span id="roleLabel">游客身份</span><span class="chevron">⌄</span>
        </button>
      </div>
    </header>

    <section class="camera-stage" id="cameraStage" aria-label="景区实景增强现实扫描区">
      <img class="scene-image" id="sceneImage" src="assets/scene-east-gate.webp" alt="嘉峪关关城实景照片">
      <video class="scene-video" id="sceneVideo" playsinline muted aria-label="手机摄像头实时画面"></video>
      <div class="scene-wash"></div>
      <div class="scene-topline">
        <span class="scene-chip"><i class="live-dot"></i><span id="sceneMode">AR 实景预览</span></span>
        <button class="location-chip" data-action="locate"><span class="pin-small">⌖</span><span id="locationLabel">开启定位</span></button>
      </div>
      <div class="scan-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div>
      <div class="floating-relic" id="floatingRelic" aria-hidden="true">
        <span class="relic-glow"></span><span class="relic-glyph">令</span>
        <span class="relic-distance" id="relicHint">龙门令碎片 · 扫描发现任务点</span>
      </div>
      <div class="scene-bottomline">
        <div class="scene-caption"><small id="sceneLocation">东闸门 · 实景取景</small><strong id="sceneHint">附近有一处未发现的线索</strong></div>
        <button class="scan-button" data-action="scan" id="scanButton" aria-label="扫描景区线索"><span class="scan-icon">⌗</span><span id="scanButtonLabel">扫描</span></button>
      </div>
    </section>

    <div class="page-scroll" id="pageScroll">
      <section class="screen-content" id="screenContent" aria-live="polite"></section>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
      <button class="nav-item" data-nav="route"><span class="nav-icon">⌖</span><small id="routeNavLabel">路线</small></button>
      <button class="nav-item" data-nav="tasks"><span class="nav-icon">☷</span><small id="taskNavLabel">任务</small></button>
      <button class="nav-scan" data-action="scan" id="navScan" aria-label="扫描景区线索"><span>⌗</span><small id="navScanLabel">扫描</small></button>
      <button class="nav-item" data-nav="fragments"><span class="nav-icon">◈</span><small id="fragmentNavLabel">碎片</small></button>
      <button class="nav-item" data-nav="rewards"><span class="nav-icon">✦</span><small id="rewardsNavLabel">兑换</small></button>
    </nav>
  </main>

  <div class="modal-scrim" id="scannerModal" hidden>
    <section class="scanner-sheet" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
      <div class="sheet-grab"></div>
      <div class="sheet-heading">
        <div><small id="scannerEyebrow">现场线索识别</small><h2 id="scannerTitle">扫描景区任务点</h2></div>
        <button class="close-button" data-action="close-scan" aria-label="关闭">×</button>
      </div>
      <div class="scanner-feed">
        <img id="scanImage" src="assets/scene-east-gate.webp" alt="嘉峪关关城实景">
        <video id="scanVideo" playsinline muted></video>
        <div class="scanner-shade"></div>
        <div class="scanner-frame"><i></i><i></i><i></i><i></i><span></span></div>
        <div class="scan-target"><span class="target-star">✦</span><strong id="scannerAim">将手机对准任务牌或现场建筑</strong><small id="scanStatus">此处为交互演示，可用相机或模拟扫描</small></div>
      </div>
      <div class="scan-actions">
        <button class="button button-quiet" data-action="enable-camera" id="cameraButton">开启手机摄像头</button>
        <button class="button button-primary" data-action="detect-clue" id="scanNearbyButton">扫描附近线索 <span>→</span></button>
      </div>
      <p class="sheet-footnote" id="scanFoot">请在安全停留处操作；实际项目需接入景区二维码 / NFC 点位。</p>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
